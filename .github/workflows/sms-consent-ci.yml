name: SMS consent safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate, build, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use declared Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Assert exact Node runtime
        run: node scripts/assert-node-version.mjs
      - name: Clean dependency install
        run: npm ci
      - name: Validate workflow safety structure
        run: npm run verify:workflow
      - name: Check SMS and changed-file formatting
        run: npm run format:check:sms
      - name: Type-check
        run: npm run typecheck
      - name: Lint full repository
        run: npm run lint
      - name: Lint SMS security scope
        run: npm run lint:sms -- --max-warnings=0
      - name: Run unit, component, and axe tests
        run: npm test
      - name: Run enforcement adversarial fixtures
        run: npm run test:enforcement
      - name: Build static production output
        run: npm run build
      - name: Verify authoritative production module graphs
        run: npm run verify:module-graph
      - name: Scan generated SMS artifacts for privacy and test leakage
        run: npm run verify:sms-artifacts
      - name: Decode and verify SMS QR payload
        run: npm run verify:qr
      - name: Require zero production dependency advisories
        run: npm run audit:production
      - name: Enforce exact expiring development advisory policy
        run: npm run audit:development

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use declared Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Assert exact Node runtime
        run: node scripts/assert-node-version.mjs
      - name: Clean dependency install
        run: npm ci
      - name: Install selected Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run security browser suite with zero skips
        run: npm run test:browser -- --project=${{ matrix.browser }}
      - name: Build for real BFCache observation
        if: matrix.browser == 'chromium'
        run: npm run build
      - name: Require a genuinely persisted pageshow in Chromium
        if: matrix.browser == 'chromium'
        run: xvfb-run -a npm run test:bfcache

  cross-repo-contract:
    # Review finding: tests/contracts/sms-consent-public-contract.test.ts
    # imports the REAL backend publicContract.ts (not a copied schema) via
    # SMS_CONSENT_BACKEND_ROOT, but no CI job ever set that up - it only
    # ran when someone happened to invoke it manually with a local
    # checkout path. That means it could silently stop running/catching
    # drift with nobody noticing. This job is the fix: check out the
    # backend repo for real and actually run it, on every push/PR.
    name: Cross-repo public contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out website repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out backend repository (services/sms-consent-capture only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: davidoseihwedieh/mymedvisit
          token: ${{ secrets.MYMEDVISIT_APP_CHECKOUT_TOKEN }}
          sparse-checkout: services/sms-consent-capture
          sparse-checkout-cone-mode: false
          path: mymedvisit-app-backend
      - name: Use declared Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Assert exact Node runtime
        run: node scripts/assert-node-version.mjs
      - name: Clean dependency install
        run: npm ci
      - name: Run cross-repo public contract test against the real backend
        env:
          SMS_CONSENT_BACKEND_ROOT: ${{ github.workspace }}/mymedvisit-app-backend/services/sms-consent-capture
        run: npm run test:cross-repo-contract
